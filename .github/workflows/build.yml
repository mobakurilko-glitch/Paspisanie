name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create project
        run: |
          mkdir -p app/src/main/java/ru/dalgau/raspisanie
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Raspisanie"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "ru.dalgau.raspisanie"
              compileSdk = 34
              defaultConfig {
                  applicationId = "ru.dalgau.raspisanie"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.1.0")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="Расписание ДальГАУ"
                  android:icon="@android:drawable/ic_menu_my_calendar"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/ru/dalgau/raspisanie/MainActivity.kt <<'EOF'
          package ru.dalgau.raspisanie

          import android.annotation.SuppressLint
          import android.content.Intent
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.os.Bundle
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout

          class MainActivity : AppCompatActivity() {
              private val scheduleUrl = "https://dalgau.fliptable.ru/timetables/7113/groups/7-1224--9"
              private lateinit var webView: WebView
              private lateinit var swipe: SwipeRefreshLayout

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  webView = WebView(this)
                  swipe = SwipeRefreshLayout(this)
                  swipe.addView(webView)
                  setContentView(swipe)

                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.cacheMode = if (isOnline()) WebSettings.LOAD_DEFAULT
                      else WebSettings.LOAD_CACHE_ELSE_NETWORK

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          if (request.url.host == "dalgau.fliptable.ru") return false
                          startActivity(Intent(Intent.ACTION_VIEW, request.url))
                          return true
                      }
                      override fun onPageFinished(view: WebView, url: String?) {
                          swipe.isRefreshing = false
                      }
                  }

                  swipe.setOnRefreshListener {
                      webView.settings.cacheMode = if (isOnline()) WebSettings.LOAD_DEFAULT
                          else WebSettings.LOAD_CACHE_ELSE_NETWORK
                      webView.reload()
                  }
                  swipe.setOnChildScrollUpCallback { _, _ -> webView.canScrollVertically(-1) }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (webView.canGoBack()) webView.goBack() else finish()
                      }
                  })

                  webView.loadUrl(scheduleUrl)
              }

              private fun isOnline(): Boolean {
                  val cm = getSystemService(ConnectivityManager::class.java)
                  val caps = cm.getNetworkCapabilities(cm.activeNetwork) ?: return false
                  return caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
              }
          }
          EOF
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: raspisanie-apk
          path: app/build/outputs/apk/debug/*.apk
